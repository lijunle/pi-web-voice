name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_OPTIONS: ""
  PI_VOICE_PROVIDER: mock

jobs:
  node:
    name: Node ${{ matrix.node }} checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["20.0.0", "22", "24", "26"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Server integration (no browser or pi-web host required)
        run: node --test test/integration/*.test.mjs

  integration:
    name: Browser integration (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install the external test host
        run: npm install --global @agegr/pi-web@0.9.0
      - name: Install managed Chromium and Linux libraries
        run: npx playwright install --with-deps chromium
      - run: npm run test:integration
      - name: Inspect the runtime package
        run: npm pack --dry-run --ignore-scripts
